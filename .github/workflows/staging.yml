name: Isolated platform checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'scripts/check-staging.mjs'
      - 'scripts/database-baseline.mjs'
      - 'scripts/migration-contract.mjs'
      - '.github/workflows/staging.yml'
  pull_request:
    paths:
      - 'supabase/bootstrap/**'
      - 'supabase/migrations/**'
      - 'scripts/check-staging.mjs'
      - 'scripts/database-baseline.mjs'
      - 'scripts/migration-contract.mjs'
      - '.github/workflows/staging.yml'
permissions:
  contents: read
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:staging
